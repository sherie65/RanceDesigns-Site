<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rance Designs | App Design Studio</title>
<style>
  :root {
    --teal: #1a5c5a;
    --gold: #c9993a;
    --cream: #faf7f2;
    --dark: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--dark);
    text-align: center;
    padding: 2rem;
  }
  .wrap {
    max-width: 32rem;
  }
  img.logo {
    width: min(70vw, 320px);
    height: auto;
    margin-bottom: 1.5rem;
  }
  h1 {
    font-size: 1.4rem;
    color: var(--teal);
    margin: 0 0 0.75rem;
    font-weight: 700;
  }
  p {
    font-size: 1rem;
    line-height: 1.5;
    margin: 0 0 1.5rem;
    color: var(--dark);
  }
  a.contact {
    display: inline-block;
    background: var(--teal);
    color: var(--cream);
    text-decoration: none;
    padding: 0.7rem 1.4rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  a.contact:hover {
    background: #12403f;
  }
  .accent {
    width: 40px;
    height: 3px;
    background: var(--gold);
    border: none;
    margin: 1.5rem auto;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="Rance Designs, App Design Studio">
    <h1>Our site is being updated</h1>
    <p>We're refreshing things behind the scenes. In the meantime, if you'd like to talk about building or redesigning an app, reach out directly.</p>
    <hr class="accent">
    <a class="contact" href="mailto:shellotravels@gmail.com">Get in Touch</a>
  </div>
</body>
</html>
